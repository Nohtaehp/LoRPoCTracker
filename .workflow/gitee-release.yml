version: '1.0'
name: gitee-release
displayName: 补传 Gitee 发行版附件
triggers:
  trigger: manual

stages:
  - name: upload
    displayName: 下载并上传安装包
    strategy: naturally
    trigger: auto
    steps:
      # 用 nodejs 插件执行脚本：Linux 容器内可直接调用 bash / curl
      - step: build@nodejs
        name: upload_asset
        displayName: 下载 GitHub 包并上传到 Gitee
        nodeVersion: 20.11.0
        commands:
          - 'VERSION=1.0.4 bash tools/gitee-upload.sh'
