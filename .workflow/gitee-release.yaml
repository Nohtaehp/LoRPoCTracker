version: '1.0'
name: gitee-release
displayName: 补传 Gitee 发行版附件
triggers:
  trigger: manual

stages:
  - name: upload
    displayName: 下载并上传安装包
    strategy: naturally
    trigger: auto
    steps:
      - step: build@shell
        name: upload_asset
        displayName: 下载 GitHub 包并上传到 Gitee
        commands:
          - 'VERSION=1.0.4 bash tools/gitee-upload.sh'
