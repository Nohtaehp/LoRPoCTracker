name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式应为 x.y.z，实际为 $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/LoRPoCTracker/LoRPoCTracker.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish

      - name: Trim runtime data (keep only required files)
        shell: pwsh
        run: |
          $data = "publish/data"
          if (Test-Path $data) {
            Get-ChildItem $data -File | Where-Object {
              $_.Name -notin @('poc_extra_cards.json','card_refs.json')
            } | Remove-Item -Force
            if (Test-Path "$data/local_assets") {
              Get-ChildItem "$data/local_assets" -Recurse -File | Where-Object {
                $_.FullName -notmatch 'illustration_roi\.json$'
              } | Remove-Item -Force
            }
          }

      - name: Package zip
        id: pkg
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "LoRPoCTracker-$v-win-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash
          $size = (Get-Item $name).Length
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $parts = $v -split '\.'
          $code = 0
          foreach ($p in $parts) { $code = $code * 1000 + [int]$p }
          while ($parts.Count -lt 3) { $code = $code * 1000; $parts += '0' }
          $manifest = @{
            version = $v
            versionCode = [int]$code
            published = (Get-Date).ToString("yyyy-MM-dd")
            notes = "详见 Release 页面：https://github.com/${{ github.repository }}/releases/tag/v$v"
            package = "${{ steps.pkg.outputs.name }}"
            sha256 = "${{ steps.pkg.outputs.hash }}"
            size = [long]"${{ steps.pkg.outputs.size }}"
            minRuntime = "none"
          } | ConvertTo-Json -Depth 3
          New-Item -ItemType Directory -Force -Path update | Out-Null
          $manifest | Out-File -FilePath update/manifest.json -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.name }}

      - name: Commit updated manifest back to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/manifest.json
          git commit -m "chore: update manifest to ${{ steps.ver.outputs.version }}" || exit 0
          git push origin HEAD:main

      # 可选：配置 secrets.GITEE_TOKEN（Gitee 私人令牌）后自动镜像代码与发行版到 Gitee
      - name: Sync to Gitee (optional)
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Host "GITEE_TOKEN 未配置，跳过 Gitee 同步"
            exit 0
          }

          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $user = if ($env:GITEE_USER) { $env:GITEE_USER } else { "wuyi12138" }
          $repo = if ($env:GITEE_REPO) { $env:GITEE_REPO } else { "wuyi12138/LoRPoCTracker" }
          $branch = "main"

          # 1) 同步分支与标签（失败不阻断 GitHub 发布）
          # Windows runner 上禁用 Git 凭据管理器，避免其尝交互认证导致超时
          $env:GIT_TERMINAL_PROMPT = "0"
          $env:GCM_INTERACTIVE = "never"
          git remote add gitee "https://${user}:$($env:GITEE_TOKEN)@gitee.com/$repo.git"
          git -c credential.helper= push gitee "HEAD:$branch" --force
          if ($LASTEXITCODE -ne 0) { Write-Warning "Gitee 分支同步失败，跳过发行版上传"; exit 0 }
          git -c credential.helper= push gitee "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) { Write-Warning "Gitee 标签同步失败，跳过发行版上传"; exit 0 }

          # 2) 创建或复用发行版
          $api = "https://gitee.com/api/v5/repos/$repo"
          $body = @{
            access_token = $env:GITEE_TOKEN
            tag_name = $tag
            name = $tag
            target_commitish = $branch
            body = "详见 Release 页面：https://github.com/${{ github.repository }}/releases/tag/$tag"
          } | ConvertTo-Json
          try {
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Body $body -ContentType "application/json"
          } catch {
            $release = Invoke-RestMethod -Uri "$api/releases/tags/$tag`?access_token=$($env:GITEE_TOKEN)"
          }

          # 3) 安装包附件不在 CI 上传：GitHub 海外 runner 到 Gitee 上传易被限速卡住。
          #    发版后请在本机运行 tools/upload-gitee-release.ps1 补传附件。
          Write-Host "Gitee 发行版已就绪（附件请本地补传）：https://gitee.com/$repo/releases/tag/$tag"
